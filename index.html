<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VUCE · Demo de gestión documentaria y operativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-800">
  <div id="app-shell" class="min-h-screen flex flex-col">
    <header id="topbar" class="hidden bg-blue-950 text-white shadow">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2">
        <a href="#/dashboard" class="text-lg font-bold tracking-wide">VUCE <span class="text-xs font-normal text-blue-300">demo</span></a>
        <nav class="flex flex-1 flex-wrap gap-1 text-sm" id="nav">
          <a data-route="dashboard" href="#/dashboard" class="rounded px-3 py-1.5 hover:bg-blue-800">Panel</a>
          <a data-route="clientes" href="#/clientes" class="rounded px-3 py-1.5 hover:bg-blue-800">Clientes</a>
          <a data-route="calendario" href="#/calendario" class="rounded px-3 py-1.5 hover:bg-blue-800">Calendario</a>
          <a data-route="ventas" href="#/ventas" class="rounded px-3 py-1.5 hover:bg-blue-800">Ventas / Despachos</a>
          <a data-route="importaciones" href="#/importaciones" class="rounded px-3 py-1.5 hover:bg-blue-800">Importaciones</a>
        </nav>
        <div class="flex items-center gap-3 text-sm">
          <span id="user-chip" class="rounded-full bg-blue-900 px-3 py-1 text-xs"></span>
          <button id="btn-logout" class="rounded border border-blue-400 px-3 py-1 text-xs hover:bg-blue-800">Salir</button>
        </div>
      </div>
    </header>
    <main id="view-root" class="mx-auto w-full max-w-7xl flex-1 px-4 py-6"></main>
    <footer class="py-3 text-center text-xs text-slate-400">
      Aplicación demostrativa · No es la plataforma oficial VUCE ni emite comprobantes válidos ante SUNAT · La IA/validaciones solo alertan; decide el personal habilitado.
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-area"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
