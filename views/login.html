<div class="mx-auto mt-16 w-full max-w-sm">
  <div class="rounded-2xl bg-white p-8 shadow-lg">
    <div class="mb-6 text-center">
      <div class="text-3xl font-bold tracking-wide text-blue-900">VUCE</div>
      <p class="mt-1 text-sm text-slate-500">Gestión documentaria y operativa · Demo</p>
    </div>
    <form class="space-y-4" autocomplete="on">
      <div data-error class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div>
      <div><label class="lbl" for="usuario">Usuario</label><input id="usuario" name="usuario" class="inp" required autocomplete="username" autofocus></div>
      <div><label class="lbl" for="password">Contraseña</label><input id="password" name="password" type="password" class="inp" required autocomplete="current-password"></div>
      <button type="submit" class="btn-primary w-full justify-center">Ingresar</button>
    </form>
    <p class="mt-4 text-center text-xs text-slate-400">Credenciales validadas contra la hoja USUARIOS. 5 intentos fallidos bloquean la cuenta 15 min.</p>
  </div>
</div>
